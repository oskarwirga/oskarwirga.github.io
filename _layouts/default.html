<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <style>
      body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; font: 18px/1.6 system-ui, sans-serif; }
      header { margin-bottom: 4rem; }
      header a { color: inherit; font-weight: 600; text-decoration: none; }
      img { max-width: 100%; }
      pre { overflow-x: auto; }
    </style>
  </head>
  <body id="top">
    <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
    <main>{{ content }}</main>
  </body>
</html>
