<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const preference = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "system";
        const resolvedTheme = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolvedTheme;
      } catch (_) {}
    </script>
    <style>
      :root { color-scheme: light; --background: #fff; --text: #111; --muted: #666; --border: #ccc; }
      :root[data-theme="dark"] { color-scheme: dark; --background: #111; --text: #eee; --muted: #aaa; --border: #555; }
      body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: var(--background); color: var(--text); font: 18px/1.6 system-ui, sans-serif; }
      .site-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4rem; }
      .site-header a { color: inherit; font-weight: 600; text-decoration: none; }
      .post-header { margin-bottom: 3rem; }
      .post-header h1 { margin-bottom: .25rem; line-height: 1.2; }
      time { color: var(--muted); font-size: .9rem; }
      button { padding: .35rem .65rem; border: 1px solid var(--border); border-radius: .25rem; background: transparent; color: inherit; font: inherit; font-size: .85rem; cursor: pointer; }
      img { max-width: 100%; }
      pre { overflow-x: auto; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme: dark; --background: #111; --text: #eee; --muted: #aaa; --border: #555; } }
    </style>
  </head>
  <body id="top">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button id="theme-toggle" type="button" hidden></button>
    </header>
    <main>
      {% if page.collection == 'posts' %}
        <article>
          <header class="post-header">
            <h1>{{ page.title }}</h1>
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
          </header>
          {{ content }}
        </article>
      {% else %}
        {{ content }}
      {% endif %}
    </main>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");
      const preferences = ["system", "light", "dark"];

      function applyTheme(preference) {
        const resolvedTheme = preference === "system"
          ? (systemTheme.matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolvedTheme;
      }

      function updateThemeToggle() {
        const preference = document.documentElement.dataset.themePreference || "system";
        const nextPreference = preferences[(preferences.indexOf(preference) + 1) % preferences.length];
        themeToggle.textContent = `Theme: ${preference[0].toUpperCase()}${preference.slice(1)}`;
        themeToggle.setAttribute("aria-label", `Color theme: ${preference}. Switch to ${nextPreference}.`);
      }

      applyTheme(document.documentElement.dataset.themePreference || "system");
      themeToggle.hidden = false;
      updateThemeToggle();
      themeToggle.addEventListener("click", () => {
        const currentPreference = document.documentElement.dataset.themePreference || "system";
        const nextPreference = preferences[(preferences.indexOf(currentPreference) + 1) % preferences.length];
        applyTheme(nextPreference);
        try {
          if (nextPreference === "system") localStorage.removeItem("theme");
          else localStorage.setItem("theme", nextPreference);
        } catch (_) {}
        updateThemeToggle();
      });
      systemTheme.addEventListener("change", () => {
        if (document.documentElement.dataset.themePreference === "system") applyTheme("system");
      });
    </script>
  </body>
</html>
